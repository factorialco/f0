name: Consumer Bundle Contract
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    uses: ./.github/workflows/_check-workspaces-changes.yaml

  consumer-bundle:
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.package_react == 'true' &&
      github.head_ref != 'release-please--branches--master' &&
      !contains(github.event.pull_request.labels.*.name, 'autorelease')
    name: "[⚛️ REACT] Consumer bundle contract"
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build core package
        run: pnpm --filter @factorialco/f0-core build
      - name: Build React package
        run: pnpm --filter @factorialco/f0-react build
      - name: Check packed consumer bundle
        run: pnpm --filter @factorialco/f0-react check:consumer-bundle
