name: Code Quality checks
on:
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  # Detect which projects have changed
  detect-changes:
    uses: ./.github/workflows/_check-workspaces-changes.yaml
  # Intentionally NOT gated on detect-changes: a big file can land anywhere in
  # the repo, including paths no package filter watches, and this check is a
  # couple of seconds. It needs no pnpm install either — just git and tsx.
  file-sizes:
    name: "File sizes"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - name: Check no tracked file is oversized
        run: npx --yes tsx@4 scripts/check-file-sizes.ts

  format:
    needs: detect-changes
    # Skips the release-please PR. Both halves are written the way they are for
    # a reason, and this is the canonical copy — the other jobs repeat it.
    #
    # `startsWith`, because the branch is `release-please--branches--main`. The
    # previous version compared against `...--master`, a branch this repo has
    # never had, so it matched nothing for as long as it existed.
    #
    # `join` before `contains`, because `contains()` over an array matches whole
    # elements, and the labels are `autorelease: pending` / `autorelease:
    # tagged` — never the bare `autorelease` the old code looked for. Flattening
    # the array to one string first turns it into the substring match that was
    # intended. The `github.event_name` guard keeps the expression well-defined
    # on non-PR events, where there is no label array to join.
    if: |
      needs.detect-changes.outputs.package_react == 'true' &&
      !startsWith(github.head_ref, 'release-please--') &&
      (github.event_name != 'pull_request' ||
        !contains(join(github.event.pull_request.labels.*.name, ','), 'autorelease'))
    name: Format
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      - name: Check formatting
        run: pnpm --filter @factorialco/f0-react run format:check
  format-react-native:
    needs: detect-changes
    # Prevents running on the release-please branch
    if: |
      needs.detect-changes.outputs.package_react_native == 'true' &&
      !startsWith(github.head_ref, 'release-please--') &&
      (github.event_name != 'pull_request' ||
        !contains(join(github.event.pull_request.labels.*.name, ','), 'autorelease'))
    name: "[📱 REACT NATIVE] Format"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      - name: Check formatting
        run: pnpm --filter @factorialco/f0-react-native run format:check
  lint:
    needs: detect-changes
    # Prevents running on the release-please branch
    if: |
      needs.detect-changes.outputs.package_react == 'true' &&
      !startsWith(github.head_ref, 'release-please--') &&
      (github.event_name != 'pull_request' ||
        !contains(join(github.event.pull_request.labels.*.name, ','), 'autorelease'))
    name: "[⚛️ REACT] Linting"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          # The lint debt step diffs against the branch point. A pull_request
          # checkout is the merge commit, so its first parent is the main tip
          # the branch was merged with; depth 2 makes that parent available.
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: "22.x"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Build core package
        run: pnpm --filter @factorialco/f0-core build
      - name: Check linting with oxlint
        run: pnpm --filter @factorialco/f0-react run lint
      # Rules with too many hits to fix at once run as warnings (the RATCHET
      # group in .oxlintrc.json). This compares them per file against
      # .scripts/lint-debt.json, a baseline that may only shrink, so a PR
      # cannot add to the debt. A step here rather than its own job: the job
      # has already installed and built core, which is most of the cost.
      #
      # `--changed`, not the whole tree: main moves under an open PR, and the
      # run that green-lights a merge is the one CI last took. Debt added or
      # fixed on main after that point is never measured, and a full gate then
      # fails the next PR for files it never opened. A file can only gain debt
      # by being edited, so judging the branch's own files loses nothing.
      - name: Check the PR adds no lint debt
        run: pnpm --filter @factorialco/f0-react run check:lint-debt --changed
      - name: Check no CSS custom properties are animated through motion
        run: pnpm exec tsx packages/react/.scripts/check-animated-css-variables.ts
  lint-react-native:
    needs: detect-changes
    # Prevents running on the release-please branch
    if: |
      needs.detect-changes.outputs.package_react_native == 'true' &&
      !startsWith(github.head_ref, 'release-please--') &&
      (github.event_name != 'pull_request' ||
        !contains(join(github.event.pull_request.labels.*.name, ','), 'autorelease'))
    name: "[📱 REACT NATIVE] Linting"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: "22.x"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Build core package
        run: pnpm --filter @factorialco/f0-core build
      - name: Check linting with oxlint
        run: pnpm --filter @factorialco/f0-react-native run lint
      - name: Check typescript
        run: pnpm --filter @factorialco/f0-react-native exec tsc --noEmit
  stable-dod:
    needs: detect-changes
    # Prevents running on the release-please branch
    if: |
      needs.detect-changes.outputs.package_react == 'true' &&
      !startsWith(github.head_ref, 'release-please--') &&
      (github.event_name != 'pull_request' ||
        !contains(join(github.event.pull_request.labels.*.name, ','), 'autorelease'))
    name: "[⚛️ REACT] Stable Definition of Done"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      # Pure filesystem scan of src/ — no build or Storybook needed.
      - name: Check the stable DoD ratchet
        run: pnpm --filter @factorialco/f0-react run check:stable-dod
  # Every component ADDED by a PR must meet the full mechanical Definition of
  # Done from day one — no new debt. Runs on every react PR (the script exits
  # 0 when no story file was added) rather than gating on the `new-component`
  # label, which is applied asynchronously by pr-package-labels.yaml and could
  # miss the first event. Escape hatch: the `skip-new-component-dod` label.
  new-component-dod:
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.package_react == 'true' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-new-component-dod') &&
      !startsWith(github.head_ref, 'release-please--') &&
      (github.event_name != 'pull_request' ||
        !contains(join(github.event.pull_request.labels.*.name, ','), 'autorelease'))
    name: "[⚛️ REACT] New Component Definition of Done"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the script diffs against origin/main to find added
          # story files.
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-pnpm
      # Pure filesystem scan of src/ + a git diff — no build needed.
      - name: Check new components meet the full DoD
        run: pnpm --filter @factorialco/f0-react run check:new-component-dod
        env:
          BASE_REF: origin/${{ github.base_ref }}
  cycle-dependencies:
    needs: detect-changes
    # Prevents running on the release-please branch
    if: |
      needs.detect-changes.outputs.package_react == 'true' &&
      !startsWith(github.head_ref, 'release-please--') &&
      (github.event_name != 'pull_request' ||
        !contains(join(github.event.pull_request.labels.*.name, ','), 'autorelease'))
    name: "[⚛️ REACT] Cycle Dependencies Check"
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: "22.x"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Build core package
        run: pnpm --filter @factorialco/f0-core build
      - name: Get latest commit from main
        id: main-commit
        run: |
          git fetch origin main:main || true
          MAIN_COMMIT=$(git rev-parse origin/main 2>/dev/null || git rev-parse main)
          echo "commit=$MAIN_COMMIT" >> $GITHUB_OUTPUT
          echo "Main branch commit: $MAIN_COMMIT"
      - name: Detect cycle dependencies and compare
        id: compare
        continue-on-error: true
        run: |
          cd packages/react

          # Run the script and capture output
          # The script may exit with 1 if new cycles are found, so we use continue-on-error
          pnpm exec tsx .scripts/check-cycle-dependencies.ts --ci --json --compare-commit ${{ steps.main-commit.outputs.commit }} > /tmp/cycle-output.txt 2>&1 || true

          # Extract JSON (find the last complete JSON object in the output)
          # The script outputs multi-line JSON, so we need to extract from the last { to the end
          # Find the line number where the last JSON object starts
          LAST_JSON_LINE=$(grep -n '^{' /tmp/cycle-output.txt | tail -n 1 | cut -d: -f1)
          if [ -z "$LAST_JSON_LINE" ]; then
            echo "ERROR: No JSON output found in script output"
            echo "Script output:"
            cat /tmp/cycle-output.txt
            exit 1
          fi

          # Extract from that line to the end of the file
          sed -n "${LAST_JSON_LINE},\$p" /tmp/cycle-output.txt > /tmp/cycle-data-raw.json

          # Use jq to parse and extract valid JSON
          if ! jq . /tmp/cycle-data-raw.json > /tmp/cycle-data.json 2>/tmp/jq-error.txt; then
            echo "ERROR: Failed to parse JSON output from cycle dependency check"
            echo "Raw JSON extraction:"
            cat /tmp/cycle-data-raw.json
            echo ""
            echo "jq error:"
            cat /tmp/jq-error.txt
            echo ""
            echo "Full script output:"
            cat /tmp/cycle-output.txt
            exit 1
          fi

          # Verify JSON has the expected structure
          if ! jq -e '.current.cycles >= 0' /tmp/cycle-data.json > /dev/null 2>&1; then
            echo "ERROR: JSON output missing expected structure (current.cycles field)"
            echo "Extracted JSON:"
            cat /tmp/cycle-data.json
            exit 1
          fi

          # Validate JSON and parse using jq
          if jq empty /tmp/cycle-data.json 2>/dev/null; then
            HAS_NEW_CYCLES=$(jq -r '.hasNewCycles // false' /tmp/cycle-data.json)
            CYCLES_DECREASED=$(jq -r '.cyclesDecreased // false' /tmp/cycle-data.json)
            CYCLES_REMOVED=$(jq -r '.cyclesRemoved // 0' /tmp/cycle-data.json)
            BASELINE_COUNT=$(jq -r '.baseline.cycles // 0' /tmp/cycle-data.json)
            CURRENT_COUNT=$(jq -r '.current.cycles // 0' /tmp/cycle-data.json)
            
            echo "new_cycles_found=$HAS_NEW_CYCLES" >> $GITHUB_OUTPUT
            echo "cycles_decreased=$CYCLES_DECREASED" >> $GITHUB_OUTPUT
            echo "cycles_removed=$CYCLES_REMOVED" >> $GITHUB_OUTPUT
            echo "baseline_count=$BASELINE_COUNT" >> $GITHUB_OUTPUT
            echo "current_count=$CURRENT_COUNT" >> $GITHUB_OUTPUT

            if [ "$HAS_NEW_CYCLES" = "true" ]; then
              # Extract new cycles list to file and output
              jq -r '.newCycles.cyclesList[]? | "  \(.cycle)"' /tmp/cycle-data.json > /tmp/new-cycles.txt
              echo "new_cycles<<CYCLES_EOF" >> $GITHUB_OUTPUT
              cat /tmp/new-cycles.txt >> $GITHUB_OUTPUT
              echo "CYCLES_EOF" >> $GITHUB_OUTPUT
            fi
          else
            echo "ERROR: Failed to validate JSON structure"
            echo "Extracted JSON:"
            cat /tmp/cycle-data.json
            exit 1
          fi
      - name: Generate comment body
        id: comment
        run: |
          cd packages/react

          NEW_CYCLES_FOUND="${{ steps.compare.outputs.new_cycles_found }}"
          CYCLES_DECREASED="${{ steps.compare.outputs.cycles_decreased }}"
          CYCLES_REMOVED="${{ steps.compare.outputs.cycles_removed }}"
          BASELINE_COUNT="${{ steps.compare.outputs.baseline_count }}"
          CURRENT_COUNT="${{ steps.compare.outputs.current_count }}"

          if [ "$NEW_CYCLES_FOUND" = "true" ]; then
            {
              echo "## ⚠️ New Circular Dependencies Detected"
              echo ""
              echo "The following new circular dependencies have been detected:"
              echo ""
              echo '```'
              jq -r '.newCycles.cyclesList[]? | "  \(.cycle)"' /tmp/cycle-data.json 2>/dev/null || echo "  (unable to load cycles)"
              echo '```'
              echo ""
              echo "Please review and resolve these circular dependencies."
            } > /tmp/comment-body.txt
          elif [ "$CYCLES_DECREASED" = "true" ]; then
            {
              echo "## 🎉 Circular Dependencies Reduced"
              echo ""
              echo "Great job! You have reduced circular dependencies by **${CYCLES_REMOVED}** (from ${BASELINE_COUNT} to ${CURRENT_COUNT})."
              echo ""
              echo "Keep up the good work!"
            } > /tmp/comment-body.txt
          else
            {
              echo "## ✅ No New Circular Dependencies"
              echo ""
              echo "No new circular dependencies detected. Current count: **${CURRENT_COUNT}**"
            } > /tmp/comment-body.txt
          fi

          # Set output for the comment action
          echo "body<<COMMENT_BODY_EOF" >> $GITHUB_OUTPUT
          cat /tmp/comment-body.txt >> $GITHUB_OUTPUT
          echo "COMMENT_BODY_EOF" >> $GITHUB_OUTPUT
      - name: Comment on PR with cycle dependency status
        uses: ./.github/actions/add-or-update-pr-comment
        with:
          comment-type: cycle_dependency
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-body: ${{ steps.comment.outputs.body }}

  # Single check to gate the branch on. It collapses this workflow's jobs into
  # one status, so branch protection lists one stable name and never needs
  # editing when jobs are added, removed, renamed or sharded.
  #
  # `if: always()` is load-bearing. Without it a failing dependency leaves this
  # job *skipped* rather than *failed*, and GitHub counts a skipped required
  # check as satisfied — the gate would go green over a red build.
  #
  # `skipped` is accepted on purpose: detect-changes skips the jobs for a
  # package that this PR did not touch. Only failure/cancellation is fatal.
  # Clones the checkout into a temp dir, installs with CI unset so lefthook
  # wires the hooks, then commits and pushes against a throwaway bare remote:
  # proves a fresh clone gets formatting/autofix on commit and the preflight
  # + typecheck on push. Costs a full install, so it only runs when a
  # hook-related file changes (see _check-workspaces-changes.yaml).
  git-hooks:
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.git_hooks == 'true' &&
      !startsWith(github.head_ref, 'release-please--') &&
      (github.event_name != 'pull_request' ||
        !contains(join(github.event.pull_request.labels.*.name, ','), 'autorelease'))
    name: "Git hooks (lefthook + lint-staged)"
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      - name: End-to-end check of the git hooks in a fresh clone
        run: pnpm hooks:e2e

  quality-passed:
    needs:
      [
        detect-changes,
        format,
        format-react-native,
        lint,
        lint-react-native,
        stable-dod,
        new-component-dod,
        cycle-dependencies,
        git-hooks,
      ]
    name: "✅ Quality"
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Confirm every Quality check passed
        run: |
          echo "Dependency results: ${{ join(needs.*.result, ' ') }}"
          if ${{ contains(needs.*.result, 'failure') }}; then
            echo "::error::A Quality check failed."
            exit 1
          fi
          if ${{ contains(needs.*.result, 'cancelled') }}; then
            echo "::error::A Quality check was cancelled."
            exit 1
          fi
          echo "All Quality checks passed (or were skipped as not applicable)."
