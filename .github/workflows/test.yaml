name: "Unit Tests"
on:
  pull_request:
  push:
    branches:
      - "main"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which projects have changed
  detect-changes:
    uses: ./.github/workflows/_check-workspaces-changes.yaml
  test:
    needs: detect-changes
    name: "[⚛️ REACT] Unit Tests"
    if: |
      needs.detect-changes.outputs.package_react == 'true' &&
      github.head_ref != 'release-please--branches--master' &&
      !contains(github.event.pull_request.labels.*.name, 'autorelease')
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      # Required to checkout the code
      contents: read
      # Required to put a comment into the pull-request
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          ## Set repository to correctly checkout from forks
          repository: ${{ github.event.pull_request.head.repo.full_name }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: "22.x"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Build core package
        run: pnpm --filter @factorialco/f0-core build
      - name: Run type checking
        run: pnpm --filter @factorialco/f0-react run tsc
      - name: Run tests
        run: pnpm --filter @factorialco/f0-react run vitest:ci --coverage.enabled true
      - name: "Report Coverage"
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          working-directory: packages/react

  # ------------------------------------------------------------------------------

  # A bugfix PR must ship a regression test: red on latest main (the test
  # reproduces the bug) and green with the fix applied. The `fix` label is
  # added by pr-name.yaml from the conventional-commit title; the title
  # fallback covers the first event, before that label lands. Escape hatch
  # for fixes that genuinely can't be unit-tested: the `skip-red-green` label.
  bugfix-red-green:
    needs: detect-changes
    name: "[⚛️ REACT] Bugfix Red-Green"
    if: |
      github.event_name == 'pull_request' &&
      needs.detect-changes.outputs.package_react == 'true' &&
      (contains(github.event.pull_request.labels.*.name, 'fix') || startsWith(github.event.pull_request.title, 'fix')) &&
      !contains(github.event.pull_request.labels.*.name, 'skip-red-green') &&
      github.head_ref != 'release-please--branches--master' &&
      !contains(github.event.pull_request.labels.*.name, 'autorelease')
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the script diffs against origin/main and builds a
          # worktree of it for the red run.
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: "22.x"
      - name: Build core package
        run: pnpm --filter @factorialco/f0-core build
      - name: Verify the regression test (red on main, green with the fix)
        run: pnpm --filter @factorialco/f0-react run check:bugfix-red-green
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: origin/${{ github.base_ref }}

  # ------------------------------------------------------------------------------

  test-react-native:
    needs: detect-changes
    name: "[📱 REACT NATIVE] Unit Tests"
    if: |
      needs.detect-changes.outputs.package_react_native == 'true'
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: "22.x"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Build core package
        run: pnpm --filter @factorialco/f0-core build
      - name: Run tests
        run: pnpm --filter @factorialco/f0-react-native run test:ci

  # Single check to gate the branch on. It collapses this workflow's jobs into
  # one status, so branch protection lists one stable name and never needs
  # editing when jobs are added, removed, renamed or sharded.
  #
  # `if: always()` is load-bearing. Without it a failing dependency leaves this
  # job *skipped* rather than *failed*, and GitHub counts a skipped required
  # check as satisfied — the gate would go green over a red build.
  #
  # `skipped` is accepted on purpose: detect-changes skips the jobs for a
  # package that this PR did not touch. Only failure/cancellation is fatal.
  unit-tests-passed:
    needs: [detect-changes, test, bugfix-red-green, test-react-native]
    name: "✅ Unit Tests"
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Confirm every Unit Tests check passed
        run: |
          echo "Dependency results: ${{ join(needs.*.result, ' ') }}"
          if ${{ contains(needs.*.result, 'failure') }}; then
            echo "::error::A Unit Tests check failed."
            exit 1
          fi
          if ${{ contains(needs.*.result, 'cancelled') }}; then
            echo "::error::A Unit Tests check was cancelled."
            exit 1
          fi
          echo "All Unit Tests checks passed (or were skipped as not applicable)."
