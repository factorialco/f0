name: "Chromatic"
on:
  push:
    branches:
      - main
  # The default type set is opened/synchronize/reopened. `ready_for_review` is
  # added because draft PRs no longer build (see the job's `if:`) — without it,
  # flipping a PR out of draft would produce no build until the next push.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

env:
  PUBLIC_BUILD: true
  # On `pull_request` GitHub builds an ephemeral merge commit that never enters
  # the repository's history. Left alone, Chromatic records the build against
  # that commit: it picks a baseline from main that is not actually an ancestor
  # of the branch, and TurboSnap — which diffs the recorded commit against the
  # baseline's — sees every change made on main since the branch point and gives
  # up on narrowing the build. These pin the build to the real PR head instead.
  CHROMATIC_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
  CHROMATIC_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CHROMATIC_SLUG: ${{ github.repository }}

# `github.sha`, not `github.ref`, for the push side: on main every commit shares
# `refs/heads/main`, so a single group covered them all and the release-please
# commit that lands ~90s after each merge cancelled the previous commit's run —
# turning that commit's `✅` gate red for no reason (the gate counts a
# cancellation as fatal, and rightly so). Main's commits arrive serially, so
# per-SHA groups cancel nothing worth keeping. PRs are unaffected: their runs
# still group by PR number, so a new push supersedes the one in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # Detect which projects have changed
  detect-changes:
    uses: ./.github/workflows/_check-workspaces-changes.yaml
  chromatic:
    needs: detect-changes
    # Every clause here exists to keep a build off Chromatic's meter. Snapshots
    # are the billed unit, so a build nobody will look at costs exactly as much
    # as one that catches a regression.
    #
    # The two release-please clauses were both dead on arrival and cost 118
    # builds in the two months before this was written — more than any human
    # branch. The branch is `release-please--branches--main`, never `--master`,
    # and the label is `autorelease: pending`/`autorelease: tagged`, so
    # `contains()` over the label array — which matches whole elements, not
    # substrings — never fired either; joining the labels into one string first
    # is what makes the prefix match work. A release PR only moves version
    # numbers and the changelog; it has no visual surface to test.
    #
    # `published/**` branches are machine copies of a branch that already has
    # its own build ("Published branch \"feat/...\""), so snapshotting them pays
    # twice for one diff; drafts are still being shaped and nobody reviews their
    # changes. Note that `github.head_ref` is empty on `push`, so the two
    # `startsWith` guards are inert there and only ever narrow pull requests.
    if: |
      needs.detect-changes.outputs.package_react == 'true' &&
      github.event.pull_request.draft != true &&
      !startsWith(github.head_ref, 'release-please--') &&
      !startsWith(github.head_ref, 'published/') &&
      (github.event_name != 'pull_request' ||
        !contains(join(github.event.pull_request.labels.*.name, ','), 'autorelease'))
    permissions: write-all
    name: "[⚛️ REACT] Run Chromatic"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Counterpart to the CHROMATIC_* variables above: check out the commit
          # they name so the tree Chromatic snapshots is the one it records.
          # Pinning the *sha* rather than the branch ref matters — a run can sit
          # in the queue while the author pushes again, and checking out the ref
          # would then snapshot a tree that CHROMATIC_SHA's commit never
          # contained, quietly baselining pixels nobody reviewed.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-node-pnpm

      - name: Build Core
        run: |
          pnpm --filter @factorialco/f0-core build

      - name: Run Chromatic
        id: chromatic
        # v13 shipped a CLI old enough that it reported "Storybook 10.3.3; no
        # supported addons found" and could not see @chromatic-com/storybook —
        # the addon TurboSnap leans on to emit preview-stats.json under Vite.
        uses: chromaui/action@v18
        with:
          # Was "/packages/react". The leading slash made this an absolute path;
          # it happened to resolve, but it is not what the input means.
          workingDir: packages/react
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          autoAcceptChanges: "main"
          exitOnceUploaded: true
          zip: true

          # TurboSnap. This lived in chromatic.config.json at the repository
          # root, where the CLI never looked: it resolves that file relative to
          # `workingDir`. The flag was therefore off for every build since it was
          # added, and each one captured the full story set instead of the
          # handful the branch touched. Keeping it here, next to the other
          # inputs, means a silent regression of that kind is visible in review.
          onlyChanged: true

          # git reports changed paths from the repository root; preview-stats
          # records them relative to the Storybook project. Without this,
          # TurboSnap cannot line the two up and falls back to a full rebuild.
          storybookBaseDir: packages/react

          # Files that reach the rendered output without passing through Vite's
          # module graph, so TurboSnap cannot trace a story back to them.
          # @factorialco/f0-core is the important one: react consumes it as a
          # built workspace package, so edits to its source look unrelated to
          # every story while changing tokens, icons and base CSS underneath all
          # of them. A change to any of these forces a full rebuild.
          externals: |
            packages/core/**
            packages/react/tailwind.config.ts
            packages/react/postcss.config.js
            packages/react/public/**
            packages/react/.storybook/static/**

          # Prints "these files changed → these story files are affected". The
          # failure this PR fixes was invisible precisely because a build that
          # snapshots everything looks identical in the log to one that does not;
          # this makes the next regression legible. Drop it if the logs get noisy.
          traceChanged: true

      - name: Publish Storybook Link in the comments
        if: github.event_name == 'pull_request'
        uses: dannyhw/storybook-chromatic-link-comment@v0.10
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          review-url: ${{ steps.chromatic.outputs.url }}
          build-url: ${{ steps.chromatic.outputs.buildUrl }}
          storybook-url: ${{ steps.chromatic.outputs.storybookUrl }}

      # The Storybook Docs Index check (storybook-docs-index.yaml) posts its
      # comment within about a minute, long before this Storybook exists, so its
      # links necessarily point at the *public* Storybook — where pages the PR
      # adds do not resolve until it merges. Now that a build for this PR is
      # published, retarget those links at it.
      #
      # The comment already contains every URL, so nothing has to be carried
      # over from that workflow's run: the base it was rendered against is
      # recorded in the comment itself. Deliberately best-effort — if that check
      # was skipped, is still running, or found nothing to report, there is no
      # comment to rewrite and this is a no-op.
      - name: Point the Storybook docs comment at this PR's build
        if: |
          github.event_name == 'pull_request' &&
          steps.chromatic.outputs.storybookUrl != ''
        uses: actions/github-script@v7
        env:
          STORYBOOK_URL: ${{ steps.chromatic.outputs.storybookUrl }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const identifier = "<!-- comment-type: storybook_docs_index -->";
            const preview = process.env.STORYBOOK_URL.replace(/\/+$/, "");
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number }
            );
            const target = comments.find(
              (c) => c.body && c.body.includes(identifier)
            );
            if (!target) {
              core.info("No Storybook docs index comment to retarget yet.");
              return;
            }

            // The base the comment was rendered against, recorded by
            // check-docs-index.ts. Its absence means an older comment format.
            const baseMatch = target.body.match(
              /<!-- storybook-base: (\S+) -->/
            );
            if (!baseMatch) {
              core.info("Comment has no storybook-base marker; leaving it be.");
              return;
            }
            const currentBase = baseMatch[1];
            if (currentBase === preview) {
              core.info("Comment already points at this build.");
              return;
            }

            // Swap the link base, record the new one, and replace the "these
            // links are not live yet" note with the preview link itself.
            let body = target.body
              .split(`${currentBase}/?path=`)
              .join(`${preview}/?path=`)
              .replace(
                /<!-- storybook-base: \S+ -->/,
                `<!-- storybook-base: ${preview} -->`
              )
              .replace(
                /<!-- link-note:start -->[\s\S]*?<!-- link-note:end -->/,
                "<!-- link-note:start -->\n" +
                  `_Links point at this PR's Storybook build — [browse the full Storybook](${preview})._\n` +
                  "<!-- link-note:end -->"
              );

            if (body === target.body) {
              core.info("Nothing to rewrite.");
              return;
            }

            await github.rest.issues.updateComment({
              owner,
              repo,
              comment_id: target.id,
              body,
            });
            core.info(`Retargeted docs comment links at ${preview}`);

  # Single check to gate the branch on. It collapses this workflow's jobs into
  # one status, so branch protection lists one stable name and never needs
  # editing when jobs are added, removed, renamed or sharded.
  #
  # `if: always()` is load-bearing. Without it a failing dependency leaves this
  # job *skipped* rather than *failed*, and GitHub counts a skipped required
  # check as satisfied — the gate would go green over a red build.
  #
  # `skipped` is accepted on purpose: detect-changes skips the jobs for a
  # package that this PR did not touch. Only failure/cancellation is fatal.
  chromatic-passed:
    needs: [detect-changes, chromatic]
    name: "✅ Chromatic"
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Confirm every Chromatic check passed
        run: |
          echo "Dependency results: ${{ join(needs.*.result, ' ') }}"
          if ${{ contains(needs.*.result, 'failure') }}; then
            echo "::error::A Chromatic check failed."
            exit 1
          fi
          if ${{ contains(needs.*.result, 'cancelled') }}; then
            echo "::error::A Chromatic check was cancelled."
            exit 1
          fi
          echo "All Chromatic checks passed (or were skipped as not applicable)."
