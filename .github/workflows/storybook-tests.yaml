name: "Storybook Tests"
on:
  pull_request:
  push:
    branches:
      - "main"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Number of machines the ~2.3k stories are split across. MUST match the length
  # of `strategy.matrix.shard` below — GitHub can't derive one from the other, so
  # they are kept in sync by hand.
  #
  # 8 is about the end of the useful range. Every shard pays the same ~4.3min of
  # fixed cost before it runs a single story (~90s install + ~40s Playwright +
  # ~170s Storybook build), and at 8 shards the test step is already down to
  # ~2min — so past here the build, not the tests, is what the job waits on.
  # Measured at 4 shards: 236/245/277/172s of test time.
  SHARD_TOTAL: 8

jobs:
  # Detect which projects have changed
  detect-changes:
    uses: ./.github/workflows/_check-workspaces-changes.yaml
  test:
    needs: detect-changes
    name: "[⚛️ REACT] Storybook Tests (${{ matrix.shard }}/8)"
    # A change to this workflow runs the matrix too. Without it the shards are
    # skipped whenever a PR touches only .github/ — and because the gate below
    # deliberately treats "skipped" as passing, a change to the Storybook Tests
    # workflow could not be validated before merging it: the gate went green
    # having run nothing. That is how the apt stall this workflow now guards
    # against reached main in the first place.
    if: |
      (needs.detect-changes.outputs.package_react == 'true' ||
       needs.detect-changes.outputs.workflow_storybook_tests == 'true') &&
      github.head_ref != 'release-please--branches--master' &&
      !contains(github.event.pull_request.labels.*.name, 'autorelease')
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      # Every shard should report — a failure in one is not a reason to hide the
      # results (or the a11y debt) found by the others.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      - name: Get Playwright version
        id: playwright-version
        run: |
          PLAYWRIGHT_VERSION=$(pnpm why @playwright/test -r --json | jq -r '.[] | select(.devDependencies["@playwright/test"]) | .devDependencies["@playwright/test"].version')
          echo "PLAYWRIGHT_VERSION: $PLAYWRIGHT_VERSION"
          echo "version=$PLAYWRIGHT_VERSION" >> $GITHUB_OUTPUT
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # `-chromium` in the key: the cache now holds only the one browser we
          # launch, so it must not restore an older all-browsers entry.
          key: playwright-chromium-${{ steps.playwright-version.outputs.version }}-${{ runner.os }}
          restore-keys: |
            playwright-chromium-${{ steps.playwright-version.outputs.version }}-
            playwright-chromium-
      # Chromium only, and deliberately *without* `--with-deps`. The test-runner
      # never launches anything else (TEST_BROWSERS is unset, so it defaults to
      # chromium), and every shared library chromium needs is already on the
      # ubuntu-latest image — on a passing shard `--with-deps` reported all of
      # them "already the newest version" and installed nothing but the nine font
      # packages the next step now handles.
      #
      # What `--with-deps` did buy was an unconditional `apt-get update`, which
      # was the least predictable part of this job (27s–121s across the 8 shards
      # of run 32146702636) and then its worst failure mode outright: when the
      # runner's azure.archive.ubuntu.com mirror is unreachable, apt falls back to
      # archive.ubuntu.com and can stall indefinitely fetching the package
      # indices. apt sets no timeout there by default, and neither did this step,
      # so the stall consumed the entire 30-minute job budget before a single
      # story ran — 4 of 8 shards in run 32230793617, then 7 of 8 in 32233463322.
      #
      # With the browser cache warm this step now touches no apt mirror at all.
      - name: Install Playwright
        timeout-minutes: 5
        run: |
          pnpx playwright@${{ steps.playwright-version.outputs.version }} install chromium

      # The font packages `--with-deps` used to pull (CJK/Thai/Cyrillic coverage
      # plus freefont), installed on their own so a slow or unreachable apt mirror
      # can no longer take the whole job down with it:
      #
      #   * `timeout-minutes` bounds a stall at 3 minutes instead of 30,
      #   * `continue-on-error` keeps a mirror outage from failing the shard, and
      #   * the Acquire::* options stop apt hanging on a dead mirror in the first
      #     place — by default it has neither a timeout nor a retry limit.
      #
      # Non-fatal is the right call because nothing in this job depends on these
      # fonts today: no story contains CJK, Thai or Cyrillic text, and the
      # test-runner makes no pixel assertions (axe + play functions only — visual
      # diffing lives in Chromatic, which sets up its own browser). They are kept
      # so a future story with international text renders real glyphs rather than
      # tofu, not because the suite needs them to pass.
      - name: Install browser fonts
        timeout-minutes: 3
        continue-on-error: true
        run: |
          APT_OPTS=(-o Acquire::Retries=3
                    -o Acquire::http::Timeout=15
                    -o Acquire::https::Timeout=15)
          sudo apt-get "${APT_OPTS[@]}" update
          sudo apt-get "${APT_OPTS[@]}" install -y --no-install-recommends \
            fonts-freefont-ttf fonts-ipafont-gothic fonts-tlwg-loma-otf \
            fonts-unifont fonts-wqy-zenhei xfonts-cyrillic xfonts-encodings \
            xfonts-scalable xfonts-utils
      - name: Build Storybook
        run: |
          pnpm --filter @factorialco/f0-core build
          pnpm --filter @factorialco/f0-react run build-storybook --quiet

      # `--shard` is forwarded to Jest, which splits by *test file* (one file per
      # CSF module) using a hash of the file path — so shards get an even file
      # *count*, not an even duration. The heaviest single suite is ~50s, which
      # is the floor on how balanced this can get; at 8 shards that outlier is a
      # visible fraction of a ~2min shard. Balancing by measured duration would
      # need a custom Jest testSequencer.
      - name: Serve Storybook and run tests
        id: run_tests
        run: |
          pnpx concurrently -k -s first -n "SB,TEST" -c "magenta,blue" \
             "pnpx http-server packages/react/storybook-static --port 6006 --silent" \
             "pnpx wait-on http://localhost:6006 --timeout 60000 && sleep 2 && pnpm --filter @factorialco/f0-react test-storybook --shard=${{ matrix.shard }}/${{ env.SHARD_TOTAL }}"

      # Each shard only sees the stories it ran, so the JSONL is partial. The
      # a11y-comment job below stitches the shards back together.
      - name: Upload a11y violations
        if: always() && steps.run_tests.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: a11y-violations-${{ matrix.shard }}
          path: packages/react/a11y-violations.jsonl
          if-no-files-found: ignore
          retention-days: 1

      # The aria surface (role + accessible-name pairs per story), captured in
      # the same postVisit pass. Sharded exactly like the a11y artifact above;
      # the aria-baseline / aria-diff jobs below stitch the shards together.
      - name: Upload aria snapshots
        if: always() && steps.run_tests.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: aria-snapshots-${{ matrix.shard }}
          path: packages/react/aria-snapshots.jsonl
          if-no-files-found: ignore
          retention-days: 1

  # Single job to gate the branch on, so protection rules do not have to list
  # every shard, and does not need editing when SHARD_TOTAL changes. Named to
  # match the "✅ …" gate every other PR workflow now exposes.
  #
  # `if: always()` is load-bearing. Without it a failing shard makes this job
  # *skipped* rather than *failed*, and a skipped check is not a red check — the
  # gate would silently pass. So it always runs and inspects the results itself.
  #
  # `skipped` is deliberately accepted: detect-changes legitimately skips the
  # whole matrix when the react package is untouched. Only failure/cancellation
  # is fatal. a11y-comment is intentionally *not* gated on — it is a best-effort
  # PR comment and is not worth blocking a merge over.
  storybook-tests-passed:
    needs: [detect-changes, test]
    name: "✅ Storybook Tests"
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Confirm every shard passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Dependency results: $RESULTS"
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "::error::At least one Storybook Tests shard failed."
            exit 1
          fi
          if [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::At least one Storybook Tests shard was cancelled."
            exit 1
          fi
          echo "All Storybook Tests shards passed (or were skipped)."

  # Turn the a11y violations captured across all shards into a single PR
  # comment, scoped to the stories/components this PR changed. Runs whenever the
  # tests actually executed (pass or fail — enforced failures still count), but
  # not when the test job was skipped entirely.
  a11y-comment:
    needs: [detect-changes, test]
    name: "[⚛️ REACT] a11y PR comment"
    if: >
      always() && needs.test.result != 'skipped' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the a11y comment can diff changed files vs main.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      # No `merge-multiple` — every shard names its file `a11y-violations.jsonl`,
      # so merging would have them overwrite each other. Downloading into
      # per-artifact subdirectories keeps all four, and `cat` concatenates them
      # (the format is one self-contained JSON object per line).
      - name: Download a11y violations from all shards
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: a11y-violations-*
          path: /tmp/a11y-shards
      - name: Merge shard artifacts
        run: |
          shopt -s nullglob
          files=(/tmp/a11y-shards/*/a11y-violations.jsonl)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No a11y violation artifacts found — nothing to report."
            exit 0
          fi
          cat "${files[@]}" > packages/react/a11y-violations.jsonl
          echo "Merged ${#files[@]} shard(s), $(wc -l < packages/react/a11y-violations.jsonl) violating stories."
      - name: Build a11y comment for changed components
        id: a11y_comment
        continue-on-error: true
        run: |
          [ -f packages/react/a11y-violations.jsonl ] || exit 0
          git fetch origin main --quiet || true
          npx --yes tsx@4 packages/react/.scripts/check-a11y-comment.ts \
            --compare-commit origin/main > /tmp/a11y-output.txt 2>&1 || true
          LAST_JSON_LINE=$(grep -n '^{' /tmp/a11y-output.txt | tail -n 1 | cut -d: -f1)
          if [ -n "$LAST_JSON_LINE" ]; then
            sed -n "${LAST_JSON_LINE},\$p" /tmp/a11y-output.txt > /tmp/a11y-data.json
            jq -r '.commentMarkdown // ""' /tmp/a11y-data.json > /tmp/a11y-comment.md || true
            {
              echo "body<<A11Y_COMMENT_EOF"
              cat /tmp/a11y-comment.md
              echo "A11Y_COMMENT_EOF"
            } >> "$GITHUB_OUTPUT"
          fi
      - name: Post a11y PR comment
        if: always() && steps.a11y_comment.outputs.body != ''
        continue-on-error: true
        uses: ./.github/actions/add-or-update-pr-comment
        with:
          comment-type: a11y_axe
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-body: ${{ steps.a11y_comment.outputs.body }}

  # Publish the aria surface of `main` — the role + accessible-name pairs every
  # story renders — so PRs have something to diff against.
  #
  # This is the whole reason the check needs no second Storybook build: the
  # workflow already visits all ~2.3k stories on every push to main, so the
  # baseline costs one artifact merge. The PR side compares against it directly.
  #
  # Deliberately gated on `needs.test.result == 'success'`: a run where a shard
  # failed produced a *partial* snapshot set, and publishing that as the
  # baseline would make the next PR report every unrun story as deleted. A
  # slightly stale but complete baseline beats a fresh broken one.
  aria-baseline:
    needs: [detect-changes, test]
    name: "[⚛️ REACT] aria baseline (main)"
    if: >
      needs.test.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # No `merge-multiple` — every shard names its file `aria-snapshots.jsonl`,
      # so merging would have them overwrite each other. Same pattern as the
      # a11y artifacts above.
      - name: Download aria snapshots from all shards
        uses: actions/download-artifact@v4
        with:
          pattern: aria-snapshots-*
          path: /tmp/aria-shards
      - name: Merge shard artifacts
        run: |
          shopt -s nullglob
          files=(/tmp/aria-shards/*/aria-snapshots.jsonl)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning::No aria snapshots produced — baseline left unchanged."
            exit 0
          fi
          mkdir -p /tmp/aria-baseline
          cat "${files[@]}" > /tmp/aria-baseline/aria-snapshots.jsonl
          echo "Merged ${#files[@]} shard(s), $(wc -l < /tmp/aria-baseline/aria-snapshots.jsonl) stories."
      # 90 days, unlike the 1-day PR artifacts: this one has to still be there
      # for whatever PR opens next. The lookup below walks back through recent
      # main runs, so an occasional gap is survivable.
      - name: Upload baseline
        uses: actions/upload-artifact@v4
        with:
          name: aria-baseline
          path: /tmp/aria-baseline/aria-snapshots.jsonl
          if-no-files-found: ignore
          retention-days: 90

  # Diff this PR's aria surface against the main baseline and comment.
  #
  # Advisory by design — it posts a comment and never fails. The point of
  # starting non-blocking is to see how much real churn these role/name diffs
  # carry before anyone's merge depends on them.
  #
  # Not gated on by "✅ Storybook Tests" for the same reason the a11y comment
  # isn't: a best-effort PR comment is not worth blocking a merge over.
  aria-diff:
    needs: [detect-changes, test]
    name: "[⚛️ REACT] aria surface diff"
    if: >
      always() && needs.test.result != 'skipped' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      # Required to list and download an artifact belonging to a *different*
      # workflow run (the main baseline).
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      # Walk recent successful main runs newest-first and take the first that
      # actually carries a non-expired baseline. A single lookup at the latest
      # run would come up empty whenever that run predates this feature, failed,
      # or had its artifact expire.
      - name: Find the latest main baseline
        id: baseline_run
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const runs = await github.rest.actions.listWorkflowRuns({
              owner, repo,
              workflow_id: 'storybook-tests.yaml',
              branch: 'main',
              event: 'push',
              status: 'success',
              per_page: 20,
            });
            for (const run of runs.data.workflow_runs) {
              const arts = await github.rest.actions.listWorkflowRunArtifacts({
                owner, repo, run_id: run.id, per_page: 100,
              });
              const hit = arts.data.artifacts.find(
                (a) => a.name === 'aria-baseline' && !a.expired
              );
              if (hit) {
                core.info(`Baseline from run ${run.id} (${run.head_sha.slice(0, 7)})`);
                core.setOutput('run_id', String(run.id));
                return;
              }
            }
            core.warning('No aria-baseline artifact found on main yet — the first main run after this lands will create one.');
            core.setOutput('run_id', '');

      - name: Download main baseline
        if: steps.baseline_run.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: aria-baseline
          path: /tmp/aria-base
          run-id: ${{ steps.baseline_run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download this PR's aria snapshots
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: aria-snapshots-*
          path: /tmp/aria-shards

      - name: Merge shard artifacts
        run: |
          shopt -s nullglob
          mkdir -p /tmp/aria-head
          files=(/tmp/aria-shards/*/aria-snapshots.jsonl)
          if [ ${#files[@]} -gt 0 ]; then
            cat "${files[@]}" > /tmp/aria-head/aria-snapshots.jsonl
            echo "Merged ${#files[@]} shard(s), $(wc -l < /tmp/aria-head/aria-snapshots.jsonl) stories."
          else
            echo "No aria snapshots from this run."
          fi

      - name: Diff the aria surface
        id: aria_diff
        continue-on-error: true
        env:
          # A failed shard means whole story files are missing from the head
          # side; the script then suppresses its "deleted story" findings rather
          # than blame the PR for stories that simply never ran.
          PARTIAL: ${{ needs.test.result != 'success' && '--partial' || '' }}
        run: |
          npx --yes tsx@4 packages/react/.scripts/check-aria-surface.ts \
            --base /tmp/aria-base \
            --head /tmp/aria-head \
            $PARTIAL > /tmp/aria-output.txt 2>&1 || true
          LAST_JSON_LINE=$(grep -n '^{' /tmp/aria-output.txt | tail -n 1 | cut -d: -f1)
          if [ -z "$LAST_JSON_LINE" ]; then
            echo "No JSON output from the aria surface check:"
            cat /tmp/aria-output.txt
            exit 0
          fi
          sed -n "${LAST_JSON_LINE},\$p" /tmp/aria-output.txt > /tmp/aria-data.json
          jq -r '.commentMarkdown // ""' /tmp/aria-data.json > /tmp/aria-comment.md || true
          BREAKING=$(jq -r '.breakingTotal // 0' /tmp/aria-data.json)
          if [ "$BREAKING" != "0" ]; then
            echo "::warning::$BREAKING accessible name/role change(s) vs main could break an existing getByRole query — see the PR comment."
          fi
          {
            echo "body<<ARIA_COMMENT_EOF"
            cat /tmp/aria-comment.md
            echo "ARIA_COMMENT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post aria surface PR comment
        if: always() && steps.aria_diff.outputs.body != ''
        continue-on-error: true
        uses: ./.github/actions/add-or-update-pr-comment
        with:
          comment-type: aria_surface
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-body: ${{ steps.aria_diff.outputs.body }}
