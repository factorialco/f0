name: Public API Surface
on:
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  # Detect which packages changed (reused across quality workflows)
  detect-changes:
    uses: ./.github/workflows/_check-workspaces-changes.yaml

  # Emit the public declaration graph for both sides in parallel. Both sides
  # use the compiler, config, and dependency graph from the merge commit; only
  # React source varies. This keeps the check focused on React source changes
  # instead of reporting dependency-version drift as an API change.
  build-dts:
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.package_react == 'true' &&
      github.head_ref != 'release-please--branches--master' &&
      !contains(github.event.pull_request.labels.*.name, 'autorelease')
    name: "[⚛️ REACT] Build types (${{ matrix.side }})"
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        side: [head, base]
    steps:
      - uses: actions/checkout@v4
        with:
          # Both sides derive from the PR *merge commit* (github.sha for
          # pull_request events: the PR head merged into the current tip of
          # main), so the PR is synced with main before the API is snapshotted.
          # Building the PR branch as-is would falsely flag everything that
          # landed on main after the branch point as "removed" (breaking).
          #   head: the merge commit itself (PR + latest main).
          #   base: the merge commit's first parent — the exact main tip the
          #         head side was merged with (checked out in the next step).
          # Depth 2 makes both parents of the merge commit available.
          fetch-depth: 2
      - uses: ./.github/actions/setup-node-pnpm
      - name: Use base React source (first parent of the merge commit)
        if: matrix.side == 'base'
        run: git checkout HEAD^1 -- packages/react/src
      - name: Build React types
        run: pnpm --filter @factorialco/f0-react exec tsc6 --project tsconfig.api-surface.json
      - name: Upload type declarations
        uses: actions/upload-artifact@v4
        with:
          name: dts-${{ matrix.side }}
          path: packages/react/.cache/api-surface/**/*.d.ts
          if-no-files-found: error
          retention-days: 1

  api-diff:
    needs: [detect-changes, build-dts]
    if: |
      needs.detect-changes.outputs.package_react == 'true' &&
      github.head_ref != 'release-please--branches--master' &&
      !contains(github.event.pull_request.labels.*.name, 'autorelease')
    name: "[⚛️ REACT] Public API surface check"
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      - name: Download head type declarations
        uses: actions/download-artifact@v4
        with:
          name: dts-head
          path: _api/head
      - name: Download base type declarations
        uses: actions/download-artifact@v4
        with:
          name: dts-base
          path: _api/base
      - name: Compare public API surface
        id: compare
        run: |
          cd packages/react

          if ! pnpm exec tsx .scripts/check-api-surface.ts \
              --base "$GITHUB_WORKSPACE/_api/base/packages/react/src" \
              --head "$GITHUB_WORKSPACE/_api/head/packages/react/src" \
              --json > /tmp/api-output.txt 2>&1; then
            cat /tmp/api-output.txt
            exit 1
          fi

          # Extract the last complete JSON object (the script prints pretty JSON;
          # same extraction pattern as the cycle-dependencies check).
          LAST_JSON_LINE=$(grep -n '^{' /tmp/api-output.txt | tail -n 1 | cut -d: -f1)
          if [ -z "$LAST_JSON_LINE" ]; then
            echo "ERROR: No JSON output found from API surface check"
            cat /tmp/api-output.txt
            exit 1
          fi
          sed -n "${LAST_JSON_LINE},\$p" /tmp/api-output.txt > /tmp/api-data-raw.json

          if ! jq . /tmp/api-data-raw.json > /tmp/api-data.json 2>/tmp/jq-error.txt; then
            echo "ERROR: Failed to parse JSON from API surface check"
            cat /tmp/api-data-raw.json
            cat /tmp/jq-error.txt
            cat /tmp/api-output.txt
            exit 1
          fi

          HAS_BREAKING=$(jq -r '.hasBreaking // false' /tmp/api-data.json)
          BREAKING_TOTAL=$(jq -r '.breakingTotal // 0' /tmp/api-data.json)
          echo "has_breaking=$HAS_BREAKING" >> "$GITHUB_OUTPUT"
          echo "breaking_total=$BREAKING_TOTAL" >> "$GITHUB_OUTPUT"

          # The script renders the ready-to-post comment body.
          jq -r '.commentMarkdown // ""' /tmp/api-data.json > /tmp/api-comment.md
          {
            echo "body<<API_COMMENT_EOF"
            cat /tmp/api-comment.md
            echo "API_COMMENT_EOF"
          } >> "$GITHUB_OUTPUT"

          if [ "$HAS_BREAKING" = "true" ]; then
            echo "::warning::$BREAKING_TOTAL breaking public API change(s) detected vs main — see the PR comment."
          fi
      - name: Comment on PR with API surface status
        uses: ./.github/actions/add-or-update-pr-comment
        with:
          comment-type: api_breaking
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-body: ${{ steps.compare.outputs.body }}
      - name: Toggle "breaking changes" label
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          HAS_BREAKING: ${{ steps.compare.outputs.has_breaking }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const label = "breaking changes";
            const breaking = process.env.HAS_BREAKING === "true";
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            if (breaking) {
              // addLabels creates the label automatically if it doesn't exist yet.
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [label] });
              core.info(`Added "${label}" label`);
            } else {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name: label });
                core.info(`Removed "${label}" label`);
              } catch (error) {
                if (error.status !== 404) throw error;
                core.info(`Label "${label}" not present; nothing to remove`);
              }
            }

  # Single check to gate the branch on. It collapses this workflow's jobs into
  # one status, so branch protection lists one stable name and never needs
  # editing when jobs are added, removed, renamed or sharded.
  #
  # `if: always()` is load-bearing. Without it a failing dependency leaves this
  # job *skipped* rather than *failed*, and GitHub counts a skipped required
  # check as satisfied — the gate would go green over a red build.
  #
  # `skipped` is accepted on purpose: detect-changes skips the jobs for a
  # package that this PR did not touch. Only failure/cancellation is fatal.
  api-surface-passed:
    needs: [detect-changes, build-dts, api-diff]
    name: "✅ API Surface"
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Confirm every API Surface check passed
        run: |
          echo "Dependency results: ${{ join(needs.*.result, ' ') }}"
          if ${{ contains(needs.*.result, 'failure') }}; then
            echo "::error::A API Surface check failed."
            exit 1
          fi
          if ${{ contains(needs.*.result, 'cancelled') }}; then
            echo "::error::A API Surface check was cancelled."
            exit 1
          fi
          echo "All API Surface checks passed (or were skipped as not applicable)."
