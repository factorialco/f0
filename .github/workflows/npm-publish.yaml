name: "Publish packages"

on:
  release:
    types: [released]
  # Release is not triggered when the release was created by another workflow using GITHUB_TOKEN https://github.com/orgs/community/discussions/25281#discussioncomment-3300251
  workflow_run:
    workflows: [Create release]
    types:
      - completed

  workflow_dispatch: # Allows manual triggering
    inputs:
      release_tag:
        description: "The release tag to checkout"
        required: true

jobs:
  publish-react:
    name: "[⚛️ REACT] Publish to npm"
    # The per-event guards must stay parenthesised as one group: `&&` binds
    # tighter than `||`, so flattening the chain applies the tag filter to the
    # first branch only and silently skips every manual dispatch.
    if: |
      github.head_ref != 'release-please--branches--master' &&
      !contains(github.event.pull_request.labels.*.name, 'autorelease') &&
      (
        (github.event_name == 'release' && contains(github.event.release.tag_name, 'react-v')) ||
        (github.event_name == 'workflow_dispatch' && contains(github.event.inputs.release_tag, 'react-v')) ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.outputs.new_version)
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.release_tag || github.sha }} # Checkout the tagged release
      - uses: ./.github/actions/publish-to-npmjs
        id: publish
        with:
          workspace: "@factorialco/f0-react"
      - name: Notify Slack
        if: ${{ steps.publish.outputs.published == 'true' }}
        env:
          RELEASE_BODY_RAW: ${{ github.event.release.body }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_NAME: ${{ github.event.release.name }}
          PACKAGE: "@factorialco/f0-react"
          NPM_URL: "https://www.npmjs.com/package/@factorialco/f0-react?activeTab=versions"
        run: |
          # 1️⃣  Convert GitHub-style markdown ➜ Slack mrkdwn
          RELEASE_BODY=$(echo "$RELEASE_BODY_RAW" | perl -pe '
            s/^### (.+)$/*\1*/;           # h3 ➜ bold
            s/^## (.+)$/*\1*/;            # h2 ➜ bold
            s/^(\s*[-*])\s+/• /;          # bullets
            s/\[([^\]]+)\]\(([^)]+)\)/<\2|\1>/g;  # links
          ')

          # 2️⃣  JSON-escape the body (newline-preserving)
          BODY_JSON=$(printf "%s" "$RELEASE_BODY" | jq -Rs .)

          # 3️⃣  Build Block-Kit payload with jq
          jq -n --arg body "$RELEASE_BODY" \
                --arg rel_url "$RELEASE_URL" \
                --arg rel_name "$RELEASE_NAME" \
                --arg npm "$NPM_URL" \
                --arg pkg "$PACKAGE" '
          {
            blocks: [
              { type: "header",
                text: { type: "plain_text", text: "⚛️ New version \($rel_name) released" } },
              { type: "section",
                text: { type: "mrkdwn", text: $body } },
              { type: "context",
                elements: [
                  { type: "mrkdwn", text: "<\($npm)|npm package>" },
                  { type: "mrkdwn", text: "<\($rel_url)|GitHub release>" }
                ] }
            ]
          }' > /tmp/payload.json

          # 4️⃣  Send
          curl -X POST -H "Content-Type: application/json" \
              --data @/tmp/payload.json \
              "${{ secrets.SLACK_WEBHOOK_ZERO_UPDATER }}"

  publish-react-native:
    name: "[📱 REACT NATIVE] Publish to npm"
    if: |
      github.head_ref != 'release-please--branches--master' &&
      !contains(github.event.pull_request.labels.*.name, 'autorelease') &&
      (
        (github.event_name == 'release' && contains(github.event.release.tag_name, 'react-native-v')) ||
        (github.event_name == 'workflow_dispatch' && contains(github.event.inputs.release_tag, 'react-native-v')) ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.outputs.new_version)
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.release_tag || github.sha }} # Checkout the tagged release
      - uses: ./.github/actions/publish-to-npmjs
        id: publish
        with:
          workspace: "@factorialco/f0-react-native"
      # Slack notification moved to publish-expo-production.yaml
      # which sends the notification after publishing the EAS production update
      # and creating the QR code update PR

  publish-core:
    name: "[🎯 CORE] Publish to npm"
    if: |
      github.head_ref != 'release-please--branches--master' &&
      !contains(github.event.pull_request.labels.*.name, 'autorelease') &&
      (
        (github.event_name == 'release' && contains(github.event.release.tag_name, 'core-v')) ||
        (github.event_name == 'workflow_dispatch' && contains(github.event.inputs.release_tag, 'core-v')) ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.outputs.new_version)
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.release_tag || github.sha }} # Checkout the tagged release
      - uses: ./.github/actions/publish-to-npmjs
        id: publish
        with:
          workspace: "@factorialco/f0-core"
      - name: Notify Slack
        if: ${{ steps.publish.outputs.published == 'true' }}
        env:
          RELEASE_BODY_RAW: ${{ github.event.release.body }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_NAME: ${{ github.event.release.name }}
          PACKAGE: "@factorialco/f0-core"
          NPM_URL: "https://www.npmjs.com/package/@factorialco/f0-core?activeTab=versions"
        run: |
          # 1️⃣  Convert GitHub-style markdown ➜ Slack mrkdwn
          RELEASE_BODY=$(echo "$RELEASE_BODY_RAW" | perl -pe '
            s/^### (.+)$/*\1*/;           # h3 ➜ bold
            s/^## (.+)$/*\1*/;            # h2 ➜ bold
            s/^(\s*[-*])\s+/• /;          # bullets
            s/\[([^\]]+)\]\(([^)]+)\)/<\2|\1>/g;  # links
          ')

          # 2️⃣  JSON-escape the body (newline-preserving)
          BODY_JSON=$(printf "%s" "$RELEASE_BODY" | jq -Rs .)

          # 3️⃣  Build Block-Kit payload with jq
          jq -n --arg body "$RELEASE_BODY" \
                --arg rel_url "$RELEASE_URL" \
                --arg rel_name "$RELEASE_NAME" \
                --arg npm "$NPM_URL" \
                --arg pkg "$PACKAGE" '
          {
            blocks: [
              { type: "header",
                text: { type: "plain_text", text: "🎯 New version \($rel_name) released" } },
              { type: "section",
                text: { type: "mrkdwn", text: $body } },
              { type: "context",
                elements: [
                  { type: "mrkdwn", text: "<\($npm)|npm package>" },
                  { type: "mrkdwn", text: "<\($rel_url)|GitHub release>" }
                ] }
            ]
          }' > /tmp/payload.json

          # 4️⃣  Send
          curl -X POST -H "Content-Type: application/json" \
              --data @/tmp/payload.json \
              "${{ secrets.SLACK_WEBHOOK_ZERO_UPDATER }}"
