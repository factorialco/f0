# Preflight before pushing: bugfix branches must include a regression unit
# test (and it must pass locally), and new components must meet the full
# Definition of Done. Same policies CI enforces on the PR — this just surfaces
# them before the push. Skip once with F0_SKIP_PREFLIGHT=1 git push.
pre-push:
  commands:
    preflight:
      run: pnpm exec tsx packages/react/.scripts/pre-push-preflight.ts

# Validate commit messages
commit-msg:
  commands:
    "lint commit message":
      run: pnpm exec commitlint --edit {1}
pre-commit:
  commands:
    format-react:
      glob: "packages/react/**/*.{js,jsx,ts,tsx,json,css,md,yml,yaml,md}"
      run: sh -c 'pnpm --filter @factorialco/f0-react format $(echo "{staged_files}" | sed "s|packages/react/||g")'
      stage_fixed: true
    lint-react:
      glob: "packages/react/**/*.{js,jsx,ts,tsx,json,css,md,yml,yaml,md}"
      run: sh -c 'pnpm --filter @factorialco/f0-react lint:fix $(echo "{staged_files}" | sed "s|packages/react/||g")'
      stage_fixed: true


    format-react-native:
      glob: "packages/react-native/**/*.{js,jsx,ts,tsx,json,css,md,yml,yaml,md}"
      run: sh -c 'pnpm --filter @factorialco/f0-react-native format $(echo "{staged_files}" | sed "s|packages/react-native/||g")'
      stage_fixed: true

    file-sizes:
      run: pnpm exec tsx scripts/check-file-sizes.ts --staged

    cycle-dependencies:
      run: pnpm exec tsx packages/react/.scripts/check-cycle-dependencies.ts --pre-commit

    animated-css-variables:
      glob: "packages/react/src/**/*.tsx"
      run: pnpm exec tsx packages/react/.scripts/check-animated-css-variables.ts --staged

    # Warn-level lint rules with a per-file baseline that may only shrink.
    # Paths are passed in, like the format and lint hooks above: the script
    # cannot read the index itself, because a git hook runs with GIT_DIR set.
    # The glob stays wide because lefthook's `src/**/*.ts` does not match a
    # file sitting directly in src/; the script narrows to src/ itself.
    lint-debt-react:
      glob: "packages/react/**/*.{js,jsx,ts,tsx}"
      run: sh -c 'pnpm --filter @factorialco/f0-react run check:lint-debt $(echo "{staged_files}" | sed "s|packages/react/||g")'

    # Globs cover every path CODEOWNERS points at, so moving or renaming an
    # owned directory fails here instead of silently losing its owner team.
    ownership:
      glob: "{CODEOWNERS,ownership/*,packages/react/src/sds/**,packages/react/src/kits/**,packages/react/src/ai/**}"
      run: pnpm --filter @factorialco/f0-ownership run check
